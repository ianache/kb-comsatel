services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${KCP_I2_MYSQL_DATABASE:-knowledge_context}
      MYSQL_USER: ${KCP_I2_MYSQL_USER:-kcp}
      MYSQL_PASSWORD: ${KCP_I2_MYSQL_PASSWORD:-kcp-local-password}
      MYSQL_ROOT_PASSWORD: ${KCP_I2_MYSQL_ROOT_PASSWORD:-root-local-password}
    ports:
      - "127.0.0.1:${KCP_I2_MYSQL_PORT:-3307}:3306"
    volumes:
      - kcp-i2-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kcp-i2-mysql:
