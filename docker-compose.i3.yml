services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "127.0.0.1:${KCP_I3_QDRANT_PORT:-6333}:6333"
    volumes:
      - kcp-i3-qdrant:/qdrant/storage
    healthcheck:
      # The minimal Qdrant image has no wget/curl; the application performs
      # the HTTP health and collection compatibility check during startup.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kcp-i3-qdrant:
